<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Conferência Universal</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --card: #111827;
      --primary: #22c55e;
      --danger: #ef4444;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      font-family: Inter, system-ui, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #020617, #0f172a);
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 20px 40px rgba(0,0,0,.45);
      border: 1px solid var(--border);
    }

    h1 {
      font-size: 20px;
      text-align: center;
      margin-bottom: 6px;
    }

    p.sub {
      font-size: 13px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 16px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: #020617;
      color: var(--text);
      font-size: 16px;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 14px;
      border-radius: 14px;
      border: none;
      background: var(--primary);
      color: #052e16;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }

    #scanner {
      margin-top: 18px;
      width: 100%;
      height: 240px;
      border-radius: 16px;
      border: 2px dashed var(--border);
      overflow: hidden;
    }

    #resultado {
      margin-top: 18px;
      padding: 16px;
      border-radius: 14px;
      font-size: 18px;
      font-weight: 700;
      text-align: center;
    }

    .ok {
      background: rgba(34,197,94,.15);
      color: var(--primary);
      border: 1px solid rgba(34,197,94,.35);
    }

    .erro {
      background: rgba(239,68,68,.15);
      color: var(--danger);
      border: 1px solid rgba(239,68,68,.35);
    }

    footer {
      margin-top: 14px;
      font-size: 11px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>

<div class="card">
  <h1>📦 Conferência Universal</h1>
  <p class="sub">Leitura livre • Vibração no acerto</p>

  <input id="codigoEsperado" placeholder="Digite a cx perdida">

  <button onclick="iniciarScanner()">📷 Iniciar leitura</button>

  <div id="scanner"></div>

  <div id="resultado"></div>

  <footer>Uso no estoque ecommerce • Jaime Giovane</footer>
</div>

<script>
  function normalizar(codigo) {
    return codigo
      .toString()
      .trim()
      .toUpperCase()
      .replace(/[^A-Z0-9]/g, '')
      .replace(/^0+/, '');
  }

  function vibrar() {
    if (navigator.vibrate) {
      navigator.vibrate([150, 50, 150]);
    }
  }

  function iniciarScanner() {
    document.getElementById("resultado").innerHTML = "";

    Quagga.init({
      inputStream: {
        type: "LiveStream",
        target: document.querySelector("#scanner"),
        constraints: { facingMode: "environment" }
      },
      decoder: {
        readers: [
          "code_128_reader",
          "ean_reader",
          "ean_8_reader",
          "upc_reader",
          "upc_e_reader",
          "code_39_reader",
          "codabar_reader",
          "i2of5_reader"
        ]
      }
    }, function(err) {
      if (err) {
        alert("Erro ao iniciar câmera");
        return;
      }
      Quagga.start();
    });

    Quagga.onDetected(function(data) {
      Quagga.stop();
      comparar(data.codeResult.code);
    });
  }

  function comparar(lido) {
    const esperado = document.getElementById("codigoEsperado").value;
    const resultado = document.getElementById("resultado");

    if (!esperado) {
      resultado.textContent = "Digite a cx perdida";
      resultado.className = "erro";
      return;
    }

    if (normalizar(lido) === normalizar(esperado)) {
      vibrar();
      resultado.innerHTML = "✅ CX ENCONTRADA: <br><small>" + lido + "</small>";
      resultado.className = "ok";
    } else {
      resultado.innerHTML = "❌ CX DIFERENTE: <br><small>Lido: " + lido + "</small>";
      resultado.className = "erro";
    }
  }
</script>

</body>
</html>
