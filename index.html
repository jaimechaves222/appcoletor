<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Verificador de Código de Barras</title>

  <!-- Biblioteca correta para código de barras -->
  <script src="https://unpkg.com/quagga@0.12.1/dist/quagga.min.js"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      padding: 20px;
      text-align: center;
    }

    input {
      padding: 12px;
      font-size: 18px;
      width: 90%;
      max-width: 400px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #scanner {
      width: 100%;
      max-width: 400px;
      height: 250px;
      margin: auto;
      border: 2px dashed #333;
    }

    #resultado {
      font-size: 22px;
      font-weight: bold;
      margin-top: 20px;
    }

    .ok { color: green; }
    .erro { color: red; }
  </style>
</head>
<body>

  <h2>📦 Conferência de Código</h2>

  <input 
    type="text" 
    id="codigoEsperado" 
    placeholder="Digite o código esperado"
  >

  <br>

  <button onclick="iniciarScanner()">📷 Iniciar leitura</button>

  <div id="scanner"></div>

  <div id="resultado"></div>

  <script>
    function iniciarScanner() {
      Quagga.init({
        inputStream: {
          name: "Live",
          type: "LiveStream",
          target: document.querySelector('#scanner'),
          constraints: {
            facingMode: "environment"
          }
        },
        decoder: {
          readers: [
            "code_128_reader",
            "ean_reader",
            "ean_8_reader",
            "upc_reader",
            "upc_e_reader"
          ]
        }
      }, function(err) {
        if (err) {
          alert("Erro ao iniciar a câmera");
          return;
        }
        Quagga.start();
      });

      Quagga.onDetected(function(data) {
        const codigoLido = data.codeResult.code;
        comparar(codigoLido);
        Quagga.stop();
      });
    }

    function comparar(codigoLido) {
      const esperado = document.getElementById("codigoEsperado").value.trim();
      const resultado = document.getElementById("resultado");

      if (!esperado) {
        resultado.innerHTML = "⚠️ Digite o código esperado";
        resultado.className = "erro";
        return;
      }

      if (codigoLido === esperado) {
        resultado.innerHTML = "✅ CONFERE<br>Código: " + codigoLido;
        resultado.className = "ok";
      } else {
        resultado.innerHTML = "❌ NÃO CONFERE<br>Lido: " + codigoLido;
        resultado.className = "erro";
      }
    }
  </script>

  <p style="margin-top:30px;font-size:14px;color:#555;">
    ⚠️ IMPORTANTE: Abra este arquivo no Google Chrome e, se possível, hospede em HTTPS
    (GitHub Pages, Netlify ou servidor interno).
  </p>

</body>
</html>
